# ====================================================================
# Builds the HALBA Android APK in the cloud.
# Trigger: every push to main, or manually (Actions tab -> Run workflow).
# Result: download "halba-debug-apk" from the run's Artifacts section.
# ====================================================================
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK (retries if a dependency mirror hiccups)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Build attempt $i failed — waiting 60s before retrying…"
            sleep 60
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halba-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
